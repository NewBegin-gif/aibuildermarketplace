<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found (404) | AIBuilder Marketplace</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e17;--card:#151b29;--border:#26304a;--text:#f1f5f9;--text2:#94a3b8;--accent:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);font-family:Inter,-apple-system,Segoe UI,sans-serif;
    text-align:center;padding:24px;line-height:1.6}
  .wrap{max-width:560px}
  .code{font-size:clamp(4rem,14vw,7rem);font-weight:800;line-height:1;
    background:linear-gradient(135deg,#3b82f6,#60a5fa);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;margin:0}
  h1{font-size:1.5rem;font-weight:700;margin:8px 0 12px}
  p{color:var(--text2);margin:0 0 28px}
  .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .links a{display:inline-block;padding:11px 20px;border-radius:10px;text-decoration:none;
    font-weight:600;font-size:.92rem;border:1px solid var(--border);color:var(--text);
    background:var(--card);transition:border-color .15s,transform .15s}
  .links a:hover{border-color:var(--accent);transform:translateY(-2px)}
  .links a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>This page wandered off.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to the good stuff.</p>
    <div class="links">
      <a class="primary" href="/">← Home</a>
      <a href="/finder/">Tool Finder</a>
      <a href="/best/">Best Tools</a>
      <a href="/b2b/">All Reviews</a>
    </div>
  </div>
</body>
</html>
