<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hellomatik">
  <!-- Plancha BLANCA deliberada (14-jul): el favicon anterior era el monograma
       negro sobre transparente + una @media (prefers-color-scheme: dark) que le
       daba fill blanco. No funcionaba: Chrome sirve el .ico (declarado 48x48),
       no este SVG, y aun sirviéndolo ignora la media query en favicons. Negro
       sobre la barra oscura = invisible. La plancha lee SIEMPRE, en cualquier
       navegador y en las dos barras, sin depender de ninguna feature.
       Por eso la tinta es fija: si volviera la media query, en Firefox/Safari
       (que sí la aplican) las letras se volverían blancas SOBRE BLANCO. -->
