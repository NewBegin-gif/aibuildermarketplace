body{padding:6px 10px}.wrap{padding:0;max-width:none}</style></head><body><div class="wrap"><div class="tool">
<label style="font-weight:800;color:#e2e8f0">Days between two dates</label>
<div class="row"><div><label for="dd-a">From</label><input type="date" id="dd-a"></div>
<div><label for="dd-b">To</label><input type="date" id="dd-b"></div></div>
<div style="margin-top:6px"><label style="font-weight:400"><input type="checkbox" id="dd-incl"> Count both end days (inclusive)</label></div>
<input type="text" id="dd-out1" class="out" readonly>
<label style="margin-top:18px;font-weight:800;color:#e2e8f0">Add days to a date (deadline)</label>
<div class="row"><div><label for="dd-start">Start date</label><input type="date" id="dd-start"></div>
<div><label for="dd-n">Days to add</label><input type="number" id="dd-n" value="14" min="1" max="3650"></div></div>
<div style="margin-top:6px"><label style="font-weight:400"><input type="checkbox" id="dd-biz"> Business days only (skip weekends)</label></div>
<input type="text" id="dd-out2" class="out" readonly>
<p class="note">Weekends = Saturday/Sunday. Public holidays differ per country and are <strong>not</strong> subtracted &mdash; check your local calendar for legal deadlines. Everything is calculated in your browser.</p></div><p style="margin:10px 0 4px;font-size:.78rem;text-align:right"><a href="https://aibuildermarketplace.com/tools/date-deadline-calculator/?utm_source=embed&utm_medium=widget" target="_blank" rel="noopener" style="color:#8b93a7;text-decoration:none">&#9889; Date & Deadline Calculator &mdash; free tool by <span style="color:#60a5fa">AIBuilder Marketplace</span></a></p></div><script>
(function(){
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmt(d){return DAYS[d.getUTCDay()]+' '+d.toISOString().slice(0,10);}
function parse(id){var v=document.getElementById(id).value;return v?new Date(v+'T00:00:00Z'):null;}
function run1(){
var a=parse('dd-a'),b=parse('dd-b'),o=document.getElementById('dd-out1');
if(!a||!b){o.value='';return;}
var ms=b-a,days=Math.round(ms/86400000);
var incl=document.getElementById('dd-incl').checked;
var shown=days+(incl?(days>=0?1:-1):0);
var lo=new Date(Math.min(a,b)),hi=new Date(Math.max(a,b)),wd=0;
for(var d=new Date(lo);d<hi;d.setUTCDate(d.getUTCDate()+1)){
var w=d.getUTCDay();if(w!==0&&w!==6)wd++;}
if(incl){var wHi=hi.getUTCDay();if(wHi!==0&&wHi!==6)wd++;}
var weeks=Math.floor(Math.abs(shown)/7),rest=Math.abs(shown)%7;
o.value=shown+' days ('+weeks+'w '+rest+'d) · '+wd+' weekdays';
track();}
function run2(){
var s=parse('dd-start'),n=parseInt(document.getElementById('dd-n').value,10),o=document.getElementById('dd-out2');
if(!s||isNaN(n)){o.value='';return;}
var biz=document.getElementById('dd-biz').checked,d=new Date(s);
if(biz){var added=0;
while(added<n){d.setUTCDate(d.getUTCDate()+1);var w=d.getUTCDay();if(w!==0&&w!==6)added++;}}
else d.setUTCDate(d.getUTCDate()+n);
o.value=fmt(d)+(biz?' ('+n+' business days later)':' ('+n+' days later)');
track();}
function track(){if(typeof gtag==='function'&&!window._dd){window._dd=1;gtag('event','tool_use',{event_label:'date-deadline-calculator'});}}
['dd-a','dd-b','dd-incl'].forEach(function(id){document.getElementById(id).addEventListener('change',run1);});
['dd-start','dd-n','dd-biz'].forEach(function(id){document.getElementById(id).addEventListener('change',run2);
document.getElementById(id).addEventListener('input',run2);});
var t=new Date().toISOString().slice(0,10);
document.getElementById('dd-a').value=t;document.getElementById('dd-start').value=t;run2();
})();</script></body></html>
