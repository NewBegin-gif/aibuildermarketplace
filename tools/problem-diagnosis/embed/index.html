var TREE={"growth": {"label": "Growth &amp; getting customers", "q": "Where does growth actually break down?", "frictions": {"traffic": {"label": "We can't get enough of the right people to notice us", "q": "Why aren't the right eyes landing on you?", "causes": {"seo": {"label": "We have no content or search presence", "diagnosis": "Your bottleneck isn't the product — it's discoverability. People can't buy what they can't find. You don't need another feature; you need a content and SEO engine that makes you show up when your buyer is already searching.", "tools": ["Frase", "Rank Math"]}, "audience": {"label": "We post, but nothing compounds — no owned audience", "diagnosis": "You're renting attention instead of owning it. Every post vanishes because you have no channel that's truly yours. The fix is an owned audience — a newsletter you control — so your reach compounds instead of resetting to zero each time.", "tools": ["Beehiiv", "ActiveCampaign"]}}}, "conversion": {"label": "We get traffic, but visitors don't convert", "q": "Why do they leave without buying?", "causes": {"trust": {"label": "We're new — no proof, reviews or track record", "diagnosis": "This isn't a go-to-market problem, it's a trust gap at the exact moment of conversion. Visitors want proof you're safe to buy from. You don't need more traffic — you need visible social proof and reviews right where the decision happens.", "tools": ["Stamped", "Superfiliate"]}, "message": {"label": "Our proposition or message isn't landing", "diagnosis": "The traffic is fine; the message isn't. If a visitor can't tell what you do and why it matters in five seconds, they bounce. The fix is sharper landing pages and testing — stop guessing which words convert and start measuring it.", "tools": ["Unbounce", "VWO"]}}}, "retention": {"label": "We win customers but they don't stick", "q": "Why don't they stick around?", "causes": {"onboarding": {"label": "New users sign up but never reach the 'aha' moment", "diagnosis": "Your leak is activation, not acquisition. People say yes then never get to value, so they quietly churn. The fix is a guided onboarding flow — automated emails and nudges — that walks them to their first real win.", "tools": ["ActiveCampaign", "Trainual"]}, "engagement": {"label": "Customers go quiet — no reason to come back", "diagnosis": "You have a relationship problem, not a product problem: nothing pulls customers back after the first use. The fix is a lifecycle engine — automated email and an owned channel — that keeps you top of mind.", "tools": ["ActiveCampaign", "Beehiiv"]}}}}}, "ops": {"label": "Operations &amp; daily chaos", "q": "What part of running the business is breaking?", "frictions": {"manual": {"label": "Too much manual copy-paste between tools", "q": "Why is it still manual?", "causes": {"noauto": {"label": "Nothing is automated — we're the glue", "diagnosis": "You've become the integration between your own tools, and that doesn't scale — it just burns your best hours on robot work. The fix isn't more discipline; it's an automation layer that moves data between systems so you don't have to.", "tools": ["Turbotic", "Lindy.ai"]}, "scattered": {"label": "Data is scattered — no single source of truth", "diagnosis": "The real issue is fragmentation: your data lives in five places, so nobody trusts any of it and reporting is guesswork. The fix is a single system of record so everyone works from the same truth.", "tools": ["SmartSuite", "Databox"]}}}, "scale": {"label": "We can't grow without hiring more people", "q": "Why does more volume need more people?", "causes": {"nosop": {"label": "Our processes live in people's heads, not systems", "diagnosis": "Your growth is capped by process debt: nothing is documented, so every new hire relearns everything and nothing automates. Systematise the repetitive 80% — SOPs and automation — before you add headcount.", "tools": ["Trainual", "Turbotic"]}, "blind": {"label": "We can't see what's going on to make decisions", "diagnosis": "You're scaling blind: without live visibility into the numbers you manage on gut and firefight surprises. The fix is a dashboard that pulls your key metrics into one view so decisions are grounded, not guessed.", "tools": ["Databox", "Wrike"]}}}, "sprawl": {"label": "We pay for too many overlapping tools", "q": "Why is the stack so bloated?", "causes": {"overlap": {"label": "Different tools do the same job", "diagnosis": "The bottleneck is stack sprawl: you're paying two or three tools for one job, and the switching between them is a hidden tax on every task. The fix is consolidation — pick the all-in-one that covers the overlap and cut the rest.", "tools": ["SmartSuite", "Wrike"]}, "noowner": {"label": "Nobody owns which tools we use or what they cost", "diagnosis": "The real issue is governance: tools get added by whoever needs them, so cost and complexity creep with no one watching. The fix starts with visibility — see the whole stack and its spend in one place — then trim.", "tools": ["Databox", "SmartSuite"]}}}}}, "cx": {"label": "Customer experience &amp; support", "q": "Where does the customer relationship break?", "frictions": {"support": {"label": "The same questions pile up and support is drowning", "q": "Why does support keep repeating itself?", "causes": {"noselfserve": {"label": "There's no self-service or automation", "diagnosis": "Your support is purely reactive — every question answered from scratch — so cost scales with growth instead of shrinking. The fix is deflection: automate the repetitive 80% so your team only handles what genuinely needs a human.", "tools": ["Freshchat", "Wati"]}, "feedback": {"label": "We don't actually know why customers leave", "diagnosis": "You're guessing at CX instead of measuring it, so you fix the wrong things while churn quietly grows. The fix is a real feedback loop — NPS and surveys — so the customer tells you where it hurts before they go.", "tools": ["SurveySparrow", "SurveyMonkey"]}}}, "reach": {"label": "We miss calls or are too slow to respond", "q": "Why are you losing them at first contact?", "causes": {"nophone": {"label": "No proper phone or answering setup", "diagnosis": "You're losing customers at the very first touch — a missed call or slow reply is often a lost deal you never even see. The fix is a real business phone and answering setup so no first contact slips through.", "tools": ["Quo", "Ruby"]}, "slow": {"label": "Responses are slow because it's all manual", "diagnosis": "Speed is the product in support: every hour of delay costs trust and deals. The fix is shared inboxes and automation so the team responds fast without anything falling through the cracks.", "tools": ["Freshchat", "Quo"]}}}, "invisible": {"label": "We deliver great service but it's invisible", "q": "Why isn't your good service working for you?", "causes": {"noreviews": {"label": "We don't collect reviews or referrals", "diagnosis": "Your best marketing is trapped: happy customers who never leave a review or refer a friend. The fix is a system that automatically asks for reviews and turns customers into referrers.", "tools": ["NiceJob", "Superfiliate"]}, "noloyalty": {"label": "No loyalty or repeat-purchase loop", "diagnosis": "You're leaving repeat revenue on the table — nothing turns a one-time buyer into a regular. The fix is a post-purchase and win-back loop that makes coming back the easy choice.", "tools": ["AfterSell", "ActiveCampaign"]}}}}}, "money": {"label": "Money &amp; financial operations", "q": "Where does the money side hurt?", "frictions": {"getpaid": {"label": "Chasing payments / cash flow is messy", "q": "Why is cash flow a mess?", "causes": {"nobilling": {"label": "No proper invoicing or getting-paid system", "diagnosis": "Your problem isn't revenue — it's collection. Money you've already earned is stuck in chasing and manual invoicing, which quietly strangles cash flow. The fix is a system that sends, tracks and collects payments for you.", "tools": ["Melio", "Bill.com"]}, "spend": {"label": "No grip on spending — who spends what", "diagnosis": "The leak isn't income, it's uncontrolled spend: subscriptions and cards nobody's watching. The fix is a business account with real spend controls and visibility so money stops slipping out the side.", "tools": ["Aspire", "Melio"]}}}, "books": {"label": "Bookkeeping and receipts are a mess", "q": "Why is the admin piling up?", "causes": {"manualbooks": {"label": "Everything is manual data entry", "diagnosis": "The bottleneck is admin drag: manual receipt and invoice entry eats hours and still ends up wrong at tax time. The fix is automated capture that feeds clean data straight into your accounting.", "tools": ["Dext", "doola"]}, "notsetup": {"label": "We're not set up properly (formation/banking)", "diagnosis": "The foundation is shaky: DIY formation and banking creates compliance and bookkeeping mess down the line. The fix is getting the back office set up right — formation, banking, bookkeeping — from the start.", "tools": ["doola", "Aspire"]}}}, "fees": {"label": "Fees quietly eat our margin", "q": "Where is the money leaking?", "causes": {"processing": {"label": "Card and payment-processing fees are too high", "diagnosis": "The silent leak is fees: a few percent on every transaction compounds into real money at volume. The fix is getting paid through a lower-fee rail and factoring fees into your pricing.", "tools": ["Payoneer", "Melio"]}, "crossborder": {"label": "We lose on currency conversion abroad", "diagnosis": "Cross-border is where it hurts most — conversion markups often cost more than the headline processing fee. The fix is an international-first payment account built for global payouts.", "tools": ["Payoneer", "Aspire"]}}}}}, "team": {"label": "Team, hiring &amp; people", "q": "Where do people and hiring break down?", "frictions": {"hiring": {"label": "Hiring is slow and we can't find good people", "q": "Where does hiring actually break?", "causes": {"sourci
