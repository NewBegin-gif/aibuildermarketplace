$('qr-logo').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f){logoImg=null;draw();return;}var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){logoImg=im;if($('qr-ec').value!=='H')$('qr-ec').value='H';draw();};im.src=rd.result;};rd.readAsDataURL(f);});
$('dl-svg').onclick=function(){if(!cur)return;var b=new Blob([cur.svg],{type:'image/svg+xml'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='qr-code.svg';a.click();if(typeof gtag==='function')gtag('event','tool_download',{event_label:'qr_svg'});};
$('dl-png').onclick=function(){if(!cur)return;var a=document.createElement('a');a.href=cur.canvas.toDataURL('image/png');a.download='qr-code.png';a.click();if(typeof gtag==='function')gtag('event','tool_download',{event_label:'qr_png'});};
draw();
})();
</script></body></html>
