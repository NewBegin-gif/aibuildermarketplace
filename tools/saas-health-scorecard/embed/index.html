<div class="row"><div><label for="sc-start">Starting ARR</label><input type="number" id="sc-start" value="1000000" min="0" step="1000"></div>

<div id="sc-out" style="margin-top:18px"></div></div><p style="margin:10px 0 4px;font-size:.78rem;text-align:right"><a href="https://aibuildermarketplace.com/tools/saas-health-scorecard/?utm_source=embed&utm_medium=widget" target="_blank" rel="noopener" style="color:#8b93a7;text-decoration:none">&#9889; SaaS Health Scorecard &mdash; free tool by <span style="color:#60a5fa">AIBuilder Marketplace</span></a></p></div><script>(function(){
var ids=['sc-start','sc-new','sc-exp','sc-churn','sc-margin','sc-burn','sc-cac','sc-acv'],out=document.getElementById('sc-out');
function g(id){return +document.getElementById(id).value;}
function card(name,val,bench,state){var c=state==='good'?'scv-g':state==='watch'?'scv-w':'scv-x';return '<div class="scv '+c+'"><div class="scv-n">'+name+'</div><div class="scv-v">'+val+'</div><div class="scv-bench">'+bench+'</div></div>';}
function calc(){var start=g('sc-start'),nw=g('sc-new'),exp=g('sc-exp'),ch=g('sc-churn'),mp=g('sc-margin'),m=mp/100,burn=g('sc-burn'),cac=g('sc-cac'),acv=g('sc-acv');

var r40=growth+mp;push('Rule of 40',Math.round(r40)+'%','growth% + margin%, target &ge; 40',r40>=40?'good':r40>=25?'watch':'concern');
if(netNew>0){var bm=burn/netNew;push('Burn multiple',bm.toFixed(2),'net burn / net-new ARR, &lt; 1 elite',bm<1?'good':bm<=2?'watch':'concern');}else{push('Burn multiple','n/a','need positive net-new ARR','watch');}
var nrr=(start+exp-ch)/start*100;push('Net revenue retention',Math.round(nrr)+'%','&gt; 110% is strong',nrr>=110?'good':nrr>=100?'watch':'concern');
var grr=(start-ch)/start*100;push('Gross revenue retention',Math.round(grr)+'%','&ge; 90% is healthy',grr>=90?'good':grr>=80?'watch':'concern');
if(ch>0){var qr=(nw+exp)/ch;push('Quick ratio',qr.toFixed(1),'(new+exp) / churned, &ge; 4 strong',qr>=4?'good':qr>=2?'watch':'concern');}else{push('Quick ratio','&infin;','no churn recorded','good');}
if(cac>0&&acv>0&&m>0){var pb=cac/((acv/12)*m);push('CAC payback',Math.round(pb)+' mo','&lt; 12 months is good',pb<12?'good':pb<=18?'watch':'concern');}
var acr=ch/start;if(cac>0&&acr>0){var lc=(acv*m/acr)/cac;push('LTV / CAC',lc.toFixed(1)+'x','&ge; 3x is healthy',lc>=3?'good':lc>=1.5?'watch':'concern');}
